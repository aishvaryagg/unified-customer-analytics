[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-customer-analytics"
version = "0.1.0"
description = "Marketing analytics on GA4 e-commerce and Microsoft MIND engagement data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "google-cloud-bigquery>=3.20",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "simple-salesforce>=1.12",
  "sqlglot>=25",
]

[project.optional-dependencies]
dev = ["duckdb>=1.0", "pytest>=8"]

[project.scripts]
uca = "uca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
